<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madden 27 Roster Trivia</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --surface: #1b2640;
      --border: #2a3958;
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.14);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.14);
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .title-wrap h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
    }
    .nav-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
      margin-top: 2px;
    }
    .score-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 12px;
      text-align: right;
      flex-shrink: 0;
    }
    .score-main {
      font-size: 0.98rem;
      font-weight: 800;
      line-height: 1.2;
    }
    .score-pct {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--green);
      margin-top: 1px;
    }
    .segmented-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .seg-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 7px 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .seg-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #93c5fd;
    }
    .pool-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }
    select, input[type="number"], input[type="text"] {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.85rem;
      outline: none;
    }
    select:focus, input:focus {
      border-color: var(--accent);
    }
    input[type="number"].tiny-num {
      width: 58px;
      text-align: center;
      font-weight: 700;
      padding: 7px 4px;
    }
