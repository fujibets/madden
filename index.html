<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madden 27 Roster Trivia</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --subcard: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 720px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    h1 { margin: 0; font-size: 1.4rem; }
    .nav-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .controls-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--subcard);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
    }
    .check-pill input { cursor: pointer; accent-color: var(--accent); }
    select, input[type="number"], input[type="text"], button {
      background: var(--subcard);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.95rem;
    }
    input[type="number"].small-num { width: 68px; text-align: center; font-weight: 700; }
    button {
      background: var(--accent);
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { opacity: 0.92; }
    button.secondary {
      background: #334155;
      color: #e2e8f0;
    }
    button.danger-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.82rem;
      padding: 5px 9px;
    }
    button.danger-ghost:hover { border-color: var(--red); color: #fca5a5; }
    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .score-box {
      display: flex;
      flex-direction: column;
    }
    .score-main {
      font-size: 1.15rem;
      font-weight: 800;
    }
    .score-pct {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .player-name {
      font-size: 1.65rem;
      font-weight: 900;
      line-height: 1.2;
    }
    .player-sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .exclude-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--subcard);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .exclude-label:hover { border-color: var(--amber); color: var(--text); }
    .inputs-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field-group label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .feedback-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: var(--subcard);
      border: 1px solid var(--border);
    }
    .feedback-title {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }
    .ok-text { color: var(--green); }
    .bad-text { color: var(--red); }
    .check-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.95rem;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mark-ok {
      color: var(--green);
      font-weight: 900;
      font-size: 1.1rem;
    }
    .mark-bad {
      color: var(--red);
      font-weight: 900;
      font-size: 1.1rem;
    }
    .muted-note { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="top-bar">
        <h1>Madden 27 Roster Trivia</h1>
        <a href="injuries.html" class="nav-link">NFL Injury Impact →</a>
      </div>

      <div class="controls-grid">
        <span style="color:var(--muted); font-weight:700;">Guess:</span>
        <label class="check-pill">
          <input type="checkbox" id="chkTeam" checked />
          Team
        </label>
        <label class="check-pill">
          <input type="checkbox" id="chkPos" checked />
          Position
        </label>
        <label class="check-pill">
          <input type="checkbox" id="chkOvr" checked />
          Rating (±5)
        </label>
      </div>

      <div class="controls-grid" style="margin-top:10px;">
        <label>
          Pool:
          <select id="poolModeSelect">
            <option value="team">Top X by Team</option>
            <option value="league">Top X League-Wide</option>
          </select>
        </label>
        <label>
          Top X:
          <input type="number" id="topXInput" class="small-num" min="1" max="500" value="3" />
        </label>
        <label class="check-pill" id="exclQbWrap">
          <input type="checkbox" id="exclQbChk" checked />
          Exclude QBs
        </label>
      </div>

      <div class="score-bar">
        <div class="score-box">
          <div class="score-main" id="scoreText">0 / 0 Correct</div>
          <div class="score-pct" id="pctText">Accuracy: —</div>
        </div>
        <div class="action-row">
          <button class="secondary" id="recapBtn" style="display:none;">Recap Missed (0)</button>
          <button class="secondary" id="resetBtn">Reset Round</button>
          <button class="danger-ghost" id="clearExcludedBtn">Clear Excluded (0)</button>
        </div>
      </div>
    </div>

    <div class="card" id="quizCard">
      <div class="muted-note">Loading madden27.csv...</div>
    </div>
  </div>

  <script>
    const POS_GROUP_MAP = {
      "QB": "QB",
      "HB": "RB", "RB": "RB", "FB": "RB",
      "WR": "WR",
      "TE": "TE",
      "LT": "OL", "LG": "OL", "C": "OL", "RG": "OL", "RT": "OL", "OT": "OL", "OG": "OL", "T": "OL", "G": "OL",
      "LEDG": "DL", "REDG": "DL", "DE": "DL", "LDE": "DL", "RDE": "DL", "DT": "DL", "NT": "DL", "LDT": "DL", "RDT": "DL",
      "MIKE": "LB", "WILL": "LB", "SAM": "LB", "MLB": "LB", "OLB": "LB", "ILB": "LB", "LB": "LB",
      "CB": "CB",
      "FS": "S", "SS": "S", "S": "S"
    };

    const NFL_TEAMS = [
      { abbr: "ARI", name: "Arizona Cardinals" },
      { abbr: "ATL", name: "Atlanta Falcons" },
      { abbr: "BAL", name: "Baltimore Ravens" },
      { abbr: "BUF", name: "Buffalo Bills" },
      { abbr: "CAR", name: "Carolina Panthers" },
      { abbr: "CHI", name: "Chicago Bears" },
      { abbr: "CIN", name: "Cincinnati Bengals" },
      { abbr: "CLE", name: "Cleveland Browns" },
      { abbr: "DAL", name: "Dallas Cowboys" },
      { abbr: "DEN", name: "Denver Broncos" },
      { abbr: "DET", name: "Detroit Lions" },
      { abbr: "GB",  name: "Green Bay Packers" },
      { abbr: "HOU", name: "Houston Texans" },
      { abbr: "IND", name: "Indianapolis Colts" },
      { abbr: "JAX", name: "Jacksonville Jaguars" },
      { abbr: "KC",  name: "Kansas City Chiefs" },
      { abbr: "LV",  name: "Las Vegas Raiders" },
      { abbr: "LAC", name: "Los Angeles Chargers" },
      { abbr: "LAR", name: "Los Angeles Rams" },
      { abbr: "MIA", name: "Miami Dolphins" },
      { abbr: "MIN", name: "Minnesota Vikings" },
      { abbr: "NE",  name: "New England Patriots" },
      { abbr: "NO",  name: "New Orleans Saints" },
      { abbr: "NYG", name: "New York Giants" },
      { abbr: "NYJ", name: "New York Jets" },
      { abbr: "PHI", name: "Philadelphia Eagles" },
      { abbr: "PIT", name: "Pittsburgh Steelers" },
      { abbr: "SF",  name: "San Francisco 49ers" },
      { abbr: "SEA", name: "Seattle Seahawks" },
      { abbr: "TB",  name: "Tampa Bay Buccaneers" },
      { abbr: "TEN", name: "Tennessee Titans" },
      { abbr: "WAS", name: "Washington Commanders" }
    ];

    const TEAM_LOOKUP = {};
    NFL_TEAMS.forEach(t => {
      TEAM_LOOKUP[t.abbr.toLowerCase()] = t.abbr;
      TEAM_LOOKUP[t.name.toLowerCase()] = t.abbr;
    });
    Object.assign(TEAM_LOOKUP, {
      "jac": "JAX", "kan": "KC", "lvr": "LV", "oak": "LV", "sd": "LAC",
      "la": "LAR", "gnb": "GB", "nep": "NE", "nor": "NO", "sfo": "SF",
      "tam": "TB", "wsh": "WAS"
    });

    const POS_GROUPS = [
      { code: "QB", label: "QB (Quarterback)" },
      { code: "RB", label: "RB (Running Back / FB)" },
      { code: "WR", label: "WR (Wide Receiver)" },
      { code: "TE", label: "TE (Tight End)" },
      { code: "OL", label: "OL (OT / OG / C)" },
      { code: "DL", label: "DL (EDGE / DE / DT)" },
      { code: "LB", label: "LB (Linebacker)" },
      { code: "CB", label: "CB (Cornerback)" },
      { code: "S",  label: "S (Safety)" }
    ];

    const SESSION_EXCL_KEY = "madden27_session_excluded_v1";
    const PREF_KEY = "madden27_trivia_prefs_v1";

    let allPlayers = [];
    let deck = [];
    let currentIdx = 0;
    let correctCount = 0;
    let answeredCount = 0;
    let missedPlayers = [];
    let isRecapMode = false;
    let answeredCurrent = false;
    let sessionExcluded = new Set();

    function loadSessionExcluded() {
      try {
        const raw = JSON.parse(sessionStorage.getItem(SESSION_EXCL_KEY) || "[]");
        sessionExcluded = new Set(raw);
      } catch (_) {
        sessionExcluded = new Set();
      }
      updateExcludedButton();
    }

    function saveSessionExcluded() {
      try {
        sessionStorage.setItem(SESSION_EXCL_KEY, JSON.stringify(Array.from(sessionExcluded)));
      } catch (_) {}
      updateExcludedButton();
    }

    function updateExcludedButton() {
      const btn = document.getElementById("clearExcludedBtn");
      btn.textContent = `Clear Excluded (${sessionExcluded.size})`;
    }

    function loadPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
        if (typeof p.chkTeam === "boolean") document.getElementById("chkTeam").checked = p.chkTeam;
        if (typeof p.chkPos === "boolean") document.getElementById("chkPos").checked = p.chkPos;
        if (typeof p.chkOvr === "boolean") document.getElementById("chkOvr").checked = p.chkOvr;
        if (p.poolMode) document.getElementById("poolModeSelect").value = p.poolMode;
        if (p.topX) document.getElementById("topXInput").value = p.topX;
        if (typeof p.exclQb === "boolean") document.getElementById("exclQbChk").checked = p.exclQb;
      } catch (_) {}
    }

    function savePrefs() {
      try {
        localStorage.setItem(PREF_KEY, JSON.stringify({
          chkTeam: document.getElementById("chkTeam").checked,
          chkPos: document.getElementById("chkPos").checked,
          chkOvr: document.getElementById("chkOvr").checked,
          poolMode: document.getElementById("poolModeSelect").value,
          topX: document.getElementById("topXInput").value,
          exclQb: document.getElementById("exclQbChk").checked
        }));
      } catch (_) {}
    }

    function normTeam(raw) {
      if (!raw) return "";
      const k = raw.trim().toLowerCase();
      return TEAM_LOOKUP[k] || "";
    }

    function getTeamFullName(abbr) {
      return NFL_TEAMS.find(t => t.abbr === abbr)?.name || abbr;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const delim = lines[0].includes("\t") ? "\t" : ",";
      const headers = lines[0].split(delim).map(h => h.trim().replace(/^"|"$/g, "").toLowerCase());

      const idxFirst = headers.findIndex(h => h === "first name" || h === "firstname");
      const idxLast = headers.findIndex(h => h === "last name" || h === "lastname");
      const idxPlayer = headers.findIndex(h => h === "player" || h === "name");
      const idxPosId = headers.findIndex(h => h === "position id" || h === "positionid");
      const idxPos = headers.findIndex(h => h === "position" || h === "pos");
      const idxTeam = headers.findIndex(h => h === "team");
      const idxOvr = headers.findIndex(h => h === "overall" || h === "ovr");

      const posCol = idxPosId !== -1 ? idxPosId : idxPos;
      const list = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(delim).map(c => c.trim().replace(/^"|"$/g, ""));
        if (cols.length < 4) continue;

        const name = idxPlayer !== -1
          ? cols[idxPlayer]
          : `${cols[idxFirst] || ""} ${cols[idxLast] || ""}`.trim();
        const teamAbbr = normTeam(cols[idxTeam]);
        const rawPos = (cols[posCol] || "").trim().toUpperCase();
        const posGroup = POS_GROUP_MAP[rawPos] || null;
        const ovr = parseInt(cols[idxOvr], 10);

        if (!name || !teamAbbr || !posGroup || isNaN(ovr)) continue;

        const id = `${name.toLowerCase()}|${teamAbbr}|${rawPos}`;
        list.push({ id, name, teamAbbr, rawPos, posGroup, ovr });
      }

      list.sort((a, b) => b.ovr - a.ovr);
      return list;
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildPool() {
      const poolMode = document.getElementById("poolModeSelect").value;
      const topX = Math.max(1, parseInt(document.getElementById("topXInput").value, 10) || 3);
      const exclQb = document.getElementById("exclQbChk").checked;

      let candidates = allPlayers.filter(p => !sessionExcluded.has(p.id));
      if (exclQb) {
        candidates = candidates.filter(p => p.posGroup !== "QB");
      }

      if (poolMode === "league") {
        return candidates.slice(0, topX);
      }

      // Top X by Team
      const byTeam = {};
      candidates.forEach(p => {
        if (!byTeam[p.teamAbbr]) byTeam[p.teamAbbr] = [];
        if (byTeam[p.teamAbbr].length < topX) {
          byTeam[p.teamAbbr].push(p);
        }
      });
      return Object.values(byTeam).flat();
    }

    function updateScoreUI() {
      document.getElementById("scoreText").textContent = `${correctCount} / ${answeredCount} Correct`;
      const pct = answeredCount > 0 ? ((correctCount / answeredCount) * 100).toFixed(1) + "%" : "—";
      document.getElementById("pctText").textContent = `Accuracy: ${pct}`;

      const recapBtn = document.getElementById("recapBtn");
      if (missedPlayers.length > 0 && !isRecapMode) {
        recapBtn.style.display = "inline-block";
        recapBtn.textContent = `Recap Missed (${missedPlayers.length})`;
      } else {
        recapBtn.style.display = "none";
      }
    }

    function startNewRound(useMissedOnly = false) {
      savePrefs();
      isRecapMode = useMissedOnly;
      answeredCurrent = false;

      if (useMissedOnly) {
        deck = shuffle(missedPlayers.filter(p => !sessionExcluded.has(p.id)));
        missedPlayers = [];
      } else {
        deck = shuffle(buildPool());
        missedPlayers = [];
      }

      currentIdx = 0;
      correctCount = 0;
      answeredCount = 0;
      updateScoreUI();
      renderCard();
    }

    function getActiveChecks() {
      return {
        team: document.getElementById("chkTeam").checked,
        pos: document.getElementById("chkPos").checked,
        ovr: document.getElementById("chkOvr").checked
      };
    }

    function renderCard() {
      const card = document.getElementById("quizCard");
      const checks = getActiveChecks();

      if (!checks.team && !checks.pos && !checks.ovr) {
        card.innerHTML = `<div class="bad-text" style="font-weight:700;">Check at least one box above (Team, Position, or Rating) to play.</div>`;
        return;
      }

      if (deck.length === 0) {
        card.innerHTML = `<div class="muted-note">No players match your current filter / session exclusions.</div>`;
        return;
      }

      if (currentIdx >= deck.length) {
        const pct = answeredCount > 0 ? ((correctCount / answeredCount) * 100).toFixed(1) : "0.0";
        card.innerHTML = `
          <div class="player-name">Round Complete!</div>
          <p style="font-size:1.1rem; margin:10px 0;">
            Final Score: <strong>${correctCount} / ${answeredCount}</strong> (${pct}%)
          </p>
          <div class="action-row" style="margin-top:14px;">
            ${missedPlayers.length > 0 ? `<button id="endRecapBtn">Drill Missed (${missedPlayers.length})</button>` : ""}
            <button class="secondary" id="endNewBtn">Start New Round</button>
          </div>
        `;
        document.getElementById("endNewBtn")?.addEventListener("click", () => startNewRound(false));
        document.getElementById("endRecapBtn")?.addEventListener("click", () => startNewRound(true));
        return;
      }

      const player = deck[currentIdx];
      answeredCurrent = false;

      const teamOptions = NFL_TEAMS.map(t =>
        `<option value="${t.abbr}">${t.abbr} — ${t.name}</option>`
      ).join("");

      const posOptions = POS_GROUPS.map(g =>
        `<option value="${g.code}">${g.label}</option>`
      ).join("");

      const modeTag = isRecapMode ? "Missed Recap • " : "";

      card.innerHTML = `
        <div class="player-header">
          <div>
            <div class="player-sub">${modeTag}Player ${currentIdx + 1} of ${deck.length}</div>
            <div class="player-name">${player.name}</div>
          </div>
          <label class="exclude-label" title="Skip this player for the rest of your current browser session">
            <input type="checkbox" id="excludePlayerChk" />
            Exclude this session
          </label>
        </div>

        <div class="inputs-row">
          ${checks.team ? `
            <div class="field-group">
              <label for="guessTeam">Team</label>
              <select id="guessTeam">
                <option value="">-- Select Team --</option>
                ${teamOptions}
              </select>
            </div>
          ` : ""}

          ${checks.pos ? `
            <div class="field-group">
              <label for="guessPos">Position Group</label>
              <select id="guessPos">
                <option value="">-- Select Position --</option>
                ${posOptions}
              </select>
            </div>
          ` : ""}

          ${checks.ovr ? `
            <div class="field-group">
              <label for="guessOvr">Rating (±5 OVR)</label>
              <input type="number" id="guessOvr" min="40" max="99" placeholder="e.g. 88" />
            </div>
          ` : ""}
        </div>

        <div class="action-row">
          <button id="submitBtn">Submit Guess</button>
          <button class="secondary" id="skipBtn">Skip</button>
        </div>

        <div id="feedbackArea"></div>
      `;

      document.getElementById("excludePlayerChk").addEventListener("change", (e) => {
        if (e.target.checked) {
          sessionExcluded.add(player.id);
          saveSessionExcluded();
          // Remove from current deck and advance immediately
          deck.splice(currentIdx, 1);
          renderCard();
        }
      });

      document.getElementById("submitBtn").addEventListener("click", () => gradeGuess(player));
      document.getElementById("skipBtn").addEventListener("click", () => {
        if (!answeredCurrent) {
          answeredCount++;
          if (!missedPlayers.some(m => m.id === player.id)) missedPlayers.push(player);
          updateScoreUI();
        }
        currentIdx++;
        renderCard();
      });

      // Allow Enter key inside rating input to submit
      const ovrInput = document.getElementById("guessOvr");
      if (ovrInput) {
        ovrInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            if (!answeredCurrent) gradeGuess(player);
            else {
              currentIdx++;
              renderCard();
            }
          }
        });
      }
    }

    function gradeGuess(player) {
      if (answeredCurrent) {
        currentIdx++;
        renderCard();
        return;
      }

      const checks = getActiveChecks();
      const results = [];
      let allRight = true;

      if (checks.team) {
        const gTeam = document.getElementById("guessTeam").value;
        if (!gTeam) {
          alert("Please select a team.");
          return;
        }
        const ok = gTeam === player.teamAbbr;
        if (!ok) allRight = false;
        results.push({
          ok,
          label: "Team",
          detail: ok
            ? `${player.teamAbbr} (${getTeamFullName(player.teamAbbr)})`
            : `Guessed ${gTeam} — Actual: ${player.teamAbbr} (${getTeamFullName(player.teamAbbr)})`
        });
      }

      if (checks.pos) {
        const gPos = document.getElementById("guessPos").value;
        if (!gPos) {
          alert("Please select a position group.");
          return;
        }
        const ok = gPos === player.posGroup;
        if (!ok) allRight = false;
        results.push({
          ok,
          label: "Position",
          detail: ok
            ? `${player.posGroup} (${player.rawPos})`
            : `Guessed ${gPos} — Actual: ${player.posGroup} (${player.rawPos})`
        });
      }

      if (checks.ovr) {
        const rawVal = document.getElementById("guessOvr").value;
        const gOvr = parseInt(rawVal, 10);
        if (isNaN(gOvr)) {
          alert("Please enter a rating guess.");
          return;
        }
        const diff = Math.abs(gOvr - player.ovr);
        const ok = diff <= 5;
        if (!ok) allRight = false;
        const diffNote = diff === 0 ? "Exact!" : (ok ? `within ${diff}` : `off by ${diff}`);
        results.push({
          ok,
          label: "Rating",
          detail: `Guessed ${gOvr} — Actual: ${player.ovr} OVR (${diffNote})`
        });
      }

      answeredCurrent = true;
      answeredCount++;
      if (allRight) {
        correctCount++;
      } else if (!missedPlayers.some(m => m.id === player.id)) {
        missedPlayers.push(player);
      }
      updateScoreUI();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.textContent = "Next Player →";
      document.getElementById("skipBtn").style.display = "none";

      const itemsHtml = results.map(r => `
        <div class="check-item">
          <span class="${r.ok ? "mark-ok" : "mark-bad"}">${r.ok ? "✓" : "✗"}</span>
          <span><strong>${r.label}:</strong> ${r.detail}</span>
        </div>
      `).join("");

      document.getElementById("feedbackArea").innerHTML = `
        <div class="feedback-box">
          <div class="feedback-title ${allRight ? "ok-text" : "bad-text"}">
            ${allRight ? "✓ Correct!" : "✗ Missed"}
          </div>
          <div class="check-list">${itemsHtml}</div>
        </div>
      `;
    }

    async function init() {
      loadPrefs();
      loadSessionExcluded();

      try {
        const res = await fetch("madden27.csv");
        if (!res.ok) throw new Error("Could not load madden27.csv");
        allPlayers = parseCSV(await res.text());
        startNewRound(false);
      } catch (err) {
        document.getElementById("quizCard").innerHTML =
          `<div class="bad-text">Error loading madden27.csv: ${err.message}</div>`;
      }
    }

    // Re-render inputs immediately when toggling Team / Position / Rating checkmarks
    ["chkTeam", "chkPos", "chkOvr"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => {
        savePrefs();
        if (!answeredCurrent) renderCard();
      });
    });

    // Rebuild pool when changing Top X by Team / League, Top X count, or Exclude QBs
    document.getElementById("poolModeSelect").addEventListener("change", () => {
      // Default Top X to 50 when switching to League-Wide if currently <= 10, or 3 when switching back to Team
      const mode = document.getElementById("poolModeSelect").value;
      const topXEl = document.getElementById("topXInput");
      const curVal = parseInt(topXEl.value, 10) || 3;
      if (mode === "league" && curVal <= 10) topXEl.value = 50;
      if (mode === "team" && curVal > 15) topXEl.value = 3;
      startNewRound(false);
    });

    document.getElementById("topXInput").addEventListener("change", () => startNewRound(false));
    document.getElementById("exclQbChk").addEventListener("change", () => startNewRound(false));

    document.getElementById("resetBtn").addEventListener("click", () => startNewRound(false));
    document.getElementById("recapBtn").addEventListener("click", () => startNewRound(true));
    document.getElementById("clearExcludedBtn").addEventListener("click", () => {
      sessionExcluded.clear();
      saveSessionExcluded();
      startNewRound(false);
    });

    init();
  </script>
</body>
</html>
